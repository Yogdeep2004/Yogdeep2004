<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 182" width="800" height="182" role="img" aria-label="How the work moves: data, research, model, evaluation, system, real world. Evaluation is the gate, and failures in the real world loop back to become the next dataset."><title>How the work moves: data, research, model, evaluation, system, real world. Evaluation is the gate, and failures in the real world loop back to become the next dataset.</title><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.fg{fill:#1F2328}.tx{fill:#3B434B}.mu{fill:#59636E}.fa{fill:#818B98}.ac{fill:#1D5FD6}.on{fill:#FFFFFF}
.b{font-weight:600}
.hair{stroke:#1F2328;stroke-opacity:.16;fill:none}
.panel{fill:#1F2328;fill-opacity:.03;stroke:#1F2328;stroke-opacity:.15}
.node{fill:#1F2328;fill-opacity:.04;stroke:#1F2328;stroke-opacity:.24}
.node-ac{fill:#1D5FD6;fill-opacity:.12;stroke:#1D5FD6;stroke-opacity:.75}
.wire{stroke:#59636E;stroke-width:1.3;fill:none}
.wire-ac{stroke:#1D5FD6;stroke-width:1.5;fill:none}
.head{fill:#59636E}.head-ac{fill:#1D5FD6}
.rail{stroke:#1F2328;stroke-opacity:.28;stroke-width:1.3;fill:none}.stop{fill:#1F2328;fill-opacity:.06;stroke:#1F2328;stroke-opacity:.6;stroke-width:1.3}.halo{fill:#1D5FD6;fill-opacity:.14}.loop{stroke-dasharray:5 5;animation:march 1.6s linear infinite}.pulse{opacity:0;animation:run 7s linear 1s infinite}@keyframes march{to{stroke-dashoffset:-20}}@keyframes run{0%{opacity:0;transform:translateX(0)}6%{opacity:1}94%{opacity:1}100%{opacity:0;transform:translateX(672.0px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 .8 7.2 4 0 7.2z" class="head"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 .8 7.2 4 0 7.2z" class="head-ac"/></marker></defs><path d="M736.0 98C736.0 22 64.0 22 64.0 99" class="wire-ac loop" marker-end="url(#b)"/><text x="400" y="26" font-size="11.5" text-anchor="middle" class="mono ac">failures become the next dataset</text><path d="M64.0 112H736.0" class="rail"/><circle cx="64.0" cy="112" r="3" class="ac pulse"/><circle cx="64.0" cy="112" r="5.5" class="stop"/><text x="64.0" y="148" font-size="12.5" letter-spacing="1.5" text-anchor="middle" class="mono b fg">DATA</text><text x="64.0" y="167" font-size="11" text-anchor="middle" class="mono mu">messy, real</text><circle cx="198.4" cy="112" r="5.5" class="stop"/><text x="198.4" y="148" font-size="12.5" letter-spacing="1.5" text-anchor="middle" class="mono b fg">RESEARCH</text><text x="198.4" y="167" font-size="11" text-anchor="middle" class="mono mu">find the gap</text><circle cx="332.8" cy="112" r="5.5" class="stop"/><text x="332.8" y="148" font-size="12.5" letter-spacing="1.5" text-anchor="middle" class="mono b fg">MODEL</text><text x="332.8" y="167" font-size="11" text-anchor="middle" class="mono mu">hypothesis in code</text><circle cx="467.2" cy="112" r="13" class="halo"/><circle cx="467.2" cy="112" r="6.5" class="ac"/><text x="467.2" y="148" font-size="12.5" letter-spacing="1.5" text-anchor="middle" class="mono b ac">EVALUATION</text><text x="467.2" y="167" font-size="11" text-anchor="middle" class="mono mu">measured first</text><circle cx="601.6" cy="112" r="5.5" class="stop"/><text x="601.6" y="148" font-size="12.5" letter-spacing="1.5" text-anchor="middle" class="mono b fg">SYSTEM</text><text x="601.6" y="167" font-size="11" text-anchor="middle" class="mono mu">shipped as a service</text><circle cx="736.0" cy="112" r="5.5" class="stop"/><text x="736.0" y="148" font-size="12.5" letter-spacing="1.5" text-anchor="middle" class="mono b fg">REAL WORLD</text><text x="736.0" y="167" font-size="11" text-anchor="middle" class="mono mu">where it breaks</text></svg>
